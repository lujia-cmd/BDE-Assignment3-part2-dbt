version: 2

models:
  - name: airbnb_listing
    description: "Monthly fact of Airbnb listings"
    columns:
      - name: listing_month_id
        tests: [unique, not_null]
      - name: listing_id
        tests: [not_null]
      - name: month_date
        tests: [not_null]
      - name: has_availability
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: host_is_superhost
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [listing_id, month_date]

  - name: dimension_host
    description: "Host dimension by month (latest per host per month)"
    columns:
      - name: host_month_id
        tests: [not_null, unique]
      - name: host_id
        tests: [not_null]
      - name: month_date
        tests: [not_null]
      - name: host_is_superhost
        tests:
          - accepted_values:
              arguments:
                values: [true, false]

  - name: dimension_property
    description: "Property attribute dimension"
    columns:
      - name: property_key
        tests: [not_null, unique]
      - name: accommodates
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"

  - name: dimension_lgamap
    description: "Neighbourhood to LGA mapping"
    columns:
      - name: suburb_key
        tests: [not_null, unique]
      - name: suburb_name
        tests: [not_null]
      - name: lga_code
        tests: [not_null]
      - name: lga_name

  - name: fact_review
    description: "Monthly latest review scores per listing"
    columns:
      - name: review_month_id
        tests: [not_null, unique]
      - name: listing_id
        tests: [not_null]
      - name: month_date
        tests: [not_null]

  - name: census_g01
    description: "Census G01 at LGA level"
    columns:
      - name: lga_code
        tests: [not_null, unique]
      - name: tot_p_m
        tests: [not_null]
      - name: tot_p_f
        tests: [not_null]
      - name: tot_p_p
        tests: [not_null]
  
  - name: census_g02
    description: "Census G02 at LGA level"
    columns:
      - name: lga_code
        tests: [not_null, unique]
      - name: median_age_persons
        tests: [not_null]